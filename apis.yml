name: Tema
description: 'Tema is a thematic, active ETF issuer founded in 2022 by CEO Maurits Pot (formerly of
  Goldman Sachs, Vitol and Kingsway Capital) and backed by Index Ventures, Accel and Zinal Growth in
  what the firm described as the largest venture round in ETFs to date. Tema builds institutional-grade,
  expert-led thematic exchange-traded funds spanning growth themes (space, oncology, electrification,
  reshoring, luxury) and core strategies, and is underpinned by an end-to-end ETF issuance infrastructure
  that also enables turnkey launches for external fund managers. The company is a consumer-facing asset
  manager; it publishes investor resources, fund pages, insights and educational content but does not
  currently expose a public developer API, SDKs, or technical documentation.'
